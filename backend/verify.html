<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<title>Security Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#05070f; --surface:rgba(255,255,255,.045);
  --border:rgba(103,232,249,.22); --border-soft:rgba(255,255,255,.09);
  --cyan:#22d3ee; --violet:#a78bfa; --ok:#2ee6a8; --err:#fb7185;
  --ink:#eef4ff; --ink-dim:#a5b4cf; --ink-faint:#64748f;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;background:var(--bg);
  font-family:'Inter',system-ui,sans-serif;
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 45% at 8% -10%,rgba(34,211,238,.28) 0%,transparent 60%),
    radial-gradient(ellipse 60% 45% at 100% 0%,rgba(167,139,250,.24) 0%,transparent 60%),
    radial-gradient(ellipse 65% 50% at 50% 115%,rgba(232,121,249,.14) 0%,transparent 65%);
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;opacity:.5;
  background:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse 80% 70% at 50% 40%,#000 30%,transparent 75%);
}
.card{
  position:relative;z-index:1;
  width:calc(100% - 32px);max-width:356px;
  background:var(--surface);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--border-soft);
  border-radius:26px;
  padding:34px 22px 28px;
  text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(103,232,249,.06),inset 0 1px 0 rgba(255,255,255,.09);
}
.card::before{
  content:'';position:absolute;top:0;left:24px;right:24px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(103,232,249,.65),rgba(167,139,250,.65),transparent);
}
.icon-zone{
  width:78px;height:78px;margin:0 auto 20px;
  position:relative;display:flex;align-items:center;justify-content:center;
}
.icon-bg{
  position:absolute;inset:0;border-radius:24px;
  background:linear-gradient(145deg,rgba(34,211,238,.16),rgba(167,139,250,.16));
  border:1.5px solid rgba(103,232,249,.35);
  transform:rotate(45deg);
  transition:background .4s,border-color .4s;
}
.icon-zone.state-ok .icon-bg{background:linear-gradient(145deg,rgba(46,230,168,.18),rgba(34,211,238,.12));border-color:rgba(46,230,168,.45);}
.icon-zone.state-err .icon-bg{background:linear-gradient(145deg,rgba(251,113,133,.16),rgba(232,121,249,.10));border-color:rgba(251,113,133,.45);}
.icon-zone svg{width:30px;height:30px;position:relative;z-index:1;transition:opacity .2s;}
@keyframes rot{to{transform:rotate(360deg)}}
.spin-ring{
  position:absolute;inset:-8px;border-radius:50%;
  border:2px solid transparent;
  border-top-color:var(--cyan);
  border-right-color:rgba(167,139,250,.35);
  animation:rot .9s linear infinite;
}
.icon-zone.state-ok .spin-ring,
.icon-zone.state-err .spin-ring{display:none;}
.title{font-family:'Space Grotesk',sans-serif;font-size:1.28rem;font-weight:700;letter-spacing:.01em;color:var(--ink);margin-bottom:5px;}
.sub{font-size:.78rem;color:var(--ink-faint);line-height:1.5;margin-bottom:22px;min-height:2.2em;}
.bar-track{height:10px;background:rgba(255,255,255,.07);border-radius:99px;margin-bottom:18px;overflow:hidden;position:relative;}
.bar-fill{
  height:100%;width:0%;border-radius:99px;position:relative;overflow:hidden;
  background:linear-gradient(90deg,#0ea5c6,#22d3ee,#a78bfa);
  box-shadow:0 0 14px rgba(34,211,238,.6);
  transition:width .5s cubic-bezier(.4,0,.2,1);
}
.bar-fill::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 20%,rgba(255,255,255,.55) 50%,transparent 80%);
  animation:sweep 1.15s linear infinite;
}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.bar-fill.s-ok{background:linear-gradient(90deg,#0d9668,#2ee6a8);box-shadow:0 0 12px rgba(46,230,168,.5);width:100%!important;}
.bar-fill.s-err{background:linear-gradient(90deg,#be3455,#fb7185);box-shadow:0 0 12px rgba(251,113,133,.5);width:100%!important;}
.brand{display:flex;flex-direction:column;align-items:center;gap:9px;margin-bottom:18px;}
.brand-coin{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.45rem;color:#3a2a05;
  background:radial-gradient(circle at 32% 30%,#ffe9a8,#f5c542 55%,#c8890a);
  border:2px solid rgba(255,233,168,.75);box-shadow:0 8px 26px rgba(245,197,66,.35),inset 0 -3px 8px rgba(0,0,0,.25);}
.brand-name{font-family:'Space Grotesk',sans-serif;font-size:.8rem;font-weight:700;letter-spacing:.42em;color:var(--ink-dim);text-indent:.42em;}
.steps{display:none;}
.step{
  display:flex;align-items:center;gap:11px;
  padding:11px 13px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.07);
  border-radius:15px;text-align:left;
  transition:border-color .3s,background .3s;
}
.step.active{border-color:rgba(103,232,249,.45);background:rgba(34,211,238,.06);}
.step.s-ok  {border-color:rgba(46,230,168,.35); background:rgba(46,230,168,.05);}
.step.s-err {border-color:rgba(251,113,133,.35); background:rgba(251,113,133,.05);}
.dot{
  width:24px;height:24px;flex-shrink:0;border-radius:9px;
  background:rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',sans-serif;font-size:.62rem;font-weight:700;color:var(--ink-faint);
  transition:background .3s,color .3s;
}
.step.active .dot{background:linear-gradient(135deg,#22d3ee,#818cf8);color:#06121f;}
.step.s-ok   .dot{background:var(--ok);color:#04150d;}
.step.s-err  .dot{background:var(--err);color:#fff;}
.step-body{flex:1;min-width:0;}
.step-name{font-family:'Space Grotesk',sans-serif;font-size:.78rem;font-weight:600;color:var(--ink-dim);letter-spacing:.01em;}
.step-info{font-size:.68rem;color:var(--ink-faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.step.active .step-info{color:#7dd3fc;}
.step.s-ok   .step-info{color:#5eead4;}
.step.s-err  .step-info{color:#fda4af;}
@keyframes sp{to{transform:rotate(360deg)}}
.sp{
  width:12px;height:12px;flex-shrink:0;border-radius:50%;
  border:2px solid rgba(103,232,249,.18);
  border-top-color:var(--cyan);
  animation:sp .7s linear infinite;
  display:none;
}
.step.active .sp{display:block;}
.pill{
  display:none;padding:12px 14px;border-radius:13px;
  font-size:.78rem;font-weight:500;line-height:1.6;text-align:left;
}
.pill strong{font-weight:700;}
.pill.s-ok {display:block;background:rgba(46,230,168,.09);color:#5eead4;border:1px solid rgba(46,230,168,.25);}
.pill.s-err{display:block;background:rgba(251,113,133,.09);color:#fda4af;border:1px solid rgba(251,113,133,.25);}
@keyframes pulse-ok{0%,100%{box-shadow:0 0 0 0 rgba(46,230,168,.28)}50%{box-shadow:0 0 0 10px rgba(46,230,168,0)}}
.icon-zone.state-ok .icon-bg{animation:pulse-ok 2s ease infinite;}
.retry-btn{
  display:none;width:100%;margin-top:14px;padding:13px;
  border:none;border-radius:13px;cursor:pointer;
  background:linear-gradient(135deg,#0d9668,#2ee6a8);
  color:#04150d;font-size:.86rem;font-weight:700;
  font-family:'Space Grotesk',sans-serif;
}
.retry-btn.show{display:block;}
.tg-btn{
  display:none;width:100%;margin-top:10px;padding:13px;
  border:none;border-radius:13px;cursor:pointer;text-decoration:none;
  background:linear-gradient(135deg,#38bdf8,#818cf8);
  color:#fff;font-size:.86rem;font-weight:700;font-family:'Space Grotesk',sans-serif;
  text-align:center;box-sizing:border-box;
}
.tg-btn.show{display:block;}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="brand-coin">A</div><div class="brand-name">ANON EARN</div></div>
  <div class="icon-zone" id="iconZone">
    <div class="spin-ring"></div>
    <div class="icon-bg"></div>
    <svg id="iShield" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      <polyline points="9 12 11 14 15 10"/>
    </svg>
    <svg id="iCheck" viewBox="0 0 24 24" fill="none" stroke="#2ee6a8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <circle cx="12" cy="12" r="10"/><polyline points="7 12 10.5 15.5 17 9"/>
    </svg>
    <svg id="iX" viewBox="0 0 24 24" fill="none" stroke="#fb7185" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <circle cx="12" cy="12" r="10"/>
      <line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
    </svg>
  </div>
  <div class="title" id="ttl">Security Check</div>
  <div class="sub"   id="sub">Verifying in the background… / ከጀርባ በመረጋገጥ ላይ…</div>
  <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
  <div class="steps">
    <div class="step active" id="s1">
      <div class="dot" id="d1">1</div>
      <div class="step-body">
        <div class="step-name">Session Validation</div>
        <div class="step-info" id="i1">Reading Telegram session…</div>
      </div>
      <div class="sp"></div>
    </div>
    <div class="step" id="s2">
      <div class="dot" id="d2">2</div>
      <div class="step-body">
        <div class="step-name">Hardware Cryptography</div>
        <div class="step-info" id="i2">Waiting…</div>
      </div>
      <div class="sp"></div>
    </div>
    <div class="step" id="s3">
      <div class="dot" id="d3">3</div>
      <div class="step-body">
        <div class="step-name">Identity Authentication</div>
        <div class="step-info" id="i3">Waiting…</div>
      </div>
      <div class="sp"></div>
    </div>
  </div>
  <div class="pill" id="pill"></div>
  <button class="retry-btn" id="retryBtn" onclick="location.reload()">🔄 እንደገና ይሞክሩ / Retry</button>
  <a class="tg-btn" id="openInTgBtn" href="#" target="_blank">📲 Open in Telegram</a>
</div>

<script>
/* ── Config ───────────────────────────────────── */
const BACKEND = ""; // same origin — this page is served by the backend itself
const BOT_USERNAME = "AnonEarnAppBot";
const _p      = new URLSearchParams(location.search);
const UID     = parseInt(_p.get("uid")    || "0", 10);
const REF_ID  = parseInt(_p.get("ref")    || "0", 10);
const MSG_ID  = parseInt(_p.get("msg_id") || "0", 10);
const DEBUG   = _p.get("debug") === "1"; // ?debug=1 → admin sees technical detail

const tg       = window.Telegram?.WebApp || null;
if(tg){ tg.ready(); tg.expand(); }
const initData = tg?.initData || "";

const TG_PLATFORM = (tg?.platform || "").toLowerCase().trim();
const TG_VERSION  = (tg?.version  || "").trim();
const TG_APP_VERSION = [TG_PLATFORM, TG_VERSION].filter(Boolean).join("_") || "unknown";

/* ── DOM ──────────────────────────────────────── */
const $bar      = document.getElementById("bar");
const $pill     = document.getElementById("pill");
const $iconZone = document.getElementById("iconZone");
const $retryBtn = document.getElementById("retryBtn");

/* ── Helpers ──────────────────────────────────── */
function setBar(p){ $bar.style.width = p + "%"; }
function activate(n){
  const el = document.getElementById(`s${n}`);
  el.classList.remove("s-ok","s-err");
  el.classList.add("active");
  document.getElementById(`i${n}`).textContent = "Processing…";
}
function ok(n, info){
  const s = document.getElementById(`s${n}`);
  s.classList.remove("active"); s.classList.add("s-ok");
  document.getElementById(`d${n}`).textContent = "✓";
  document.getElementById(`i${n}`).textContent = info;
}
function err(n, info){
  const s = document.getElementById(`s${n}`);
  s.classList.remove("active"); s.classList.add("s-err");
  document.getElementById(`d${n}`).textContent = "✕";
  document.getElementById(`i${n}`).textContent = info;
}
function showOK(){
  $iconZone.classList.add("state-ok");
  document.getElementById("iShield").style.display = "none";
  document.getElementById("iCheck").style.display  = "";
  document.getElementById("ttl").textContent = "Verified!";
  document.getElementById("sub").textContent = "Welcome! Opening your dashboard…";
  $bar.classList.add("s-ok");
  $pill.className   = "pill s-ok";
  $pill.textContent = "✅ Verification complete. Opening app…";
  tg?.HapticFeedback?.notificationOccurred("success");
}
function showErr(reason, allowRetry, detail){
  $iconZone.classList.remove("state-ok");
  $iconZone.classList.add("state-err");
  document.getElementById("iShield").style.display = "none";
  document.getElementById("iCheck").style.display  = "none";
  document.getElementById("iX").style.display      = "";
  $bar.classList.remove("s-ok");
  $bar.classList.add("s-err");
  $pill.className = "pill s-err";

  /*
   * NOTE: messaging softened on purpose.
   * Hard, irreversible "BANNED — retrying is pointless" language was
   * discouraging legitimate users from trying again after fixing a real
   * issue (VPN still on, weak signal, temporary duplicate-device flag).
   * Server-side fraud rules now only hard-ban on strong combined signals
   * (fingerprint + IP both matching, etc). Anything softer surfaces a
   * normal "couldn't verify, try again / contact admin" message instead.
   */
  const SELF_REASONS  = new Set(["self_invite", "same_device_as_referrer"]);
  const MULTI_REASONS = new Set([
    "correlated_clone", "ip_farm", "banned_ip"
  ]);

  let category;
  if (reason === "no_tg_session") {
    category = "not_telegram";
  } else if (reason === "network" || reason === "server_error") {
    category = reason;                    // already an exact client-side category
  } else if (reason === "vpn") {
    category = "vpn";
  } else if (reason === "ip_cooldown") {
    category = "cooldown";
  } else if (reason === "no_fingerprint") {
    category = "device_retry";
  } else if (SELF_REASONS.has(reason)) {
    category = "self";
  } else if (MULTI_REASONS.has(reason)) {
    category = "multi";
  } else {
    category = "device_retry";
  }

  const msgs = {
    not_telegram: {
      t:"Open in Telegram", s:"This only works inside Telegram.",
      b:"✈️ <strong>ይሄ ገጽ የሚሰራው በ Telegram ውስጥ ብቻ ነው።</strong><br>ይመስላል ከ Telegram ውጭ (ለምሳሌ መደበኛ browser) ከፍተውታል። ከታች ያለውን ቁልፍ በመጫን ወደ ቦቱ ይመለሱ።"
    },
    vpn: {
      t:"VPN Detected", s:"Please disable VPN and try again.",
      b:"🔒 <strong>እባክዎ VPN ያጥፉ!</strong><br>VPN ግንኙነት ስለተገኘ ማለፍ አልተቻለም።<br>VPN <strong>Disconnect</strong> አድርገው እንደገና ይሞክሩ።"
    },
    cooldown: {
      t:"Please Wait", s:"Too many attempts from this network.",
      b:"⚠️ <strong>እባክዎ ለማጭበርበር አይሞክሩ!</strong><br>payout request ላይ የእርስዎ መረጃ ስለሚታይ የመከልከል ምክንያት ሊሆኑብዎት ይችላል ስለዚህ ትክክለኛ ሰዉ በመጋበዝ ገንዘብ ይስሩ ይጠንቀቁ ።"
    },
    device_retry: {
      t:"Couldn't Verify", s:"We couldn't check your device — please retry.",
      b:"⚠️ <strong>ማረጋገጥ አልተቻለም።</strong><br>እባክዎ app ዝግተው/ከፍተው እንደገና ይሞክሩ። ችግሩ ከቀጠለ admin ያነጋግሩ።"
    },
    self: {
      t:"Verification Failed", s:"Self-invite is not allowed.",
      b:"⚠️ <strong>ራስን መጋበዝ አይፈቀድም።</strong><br>ይሄ ሊንክ ስራ ላይ የሚውለው ሌላ ሰው ሲጠቀምበት ብቻ ነው። ስህተት ይመስልዎታል ካለ admin ያነጋግሩ።"
    },
    multi: {
      t:"Verification Failed", s:"This device/account looks like a duplicate.",
      b:"⚠️ <strong>ይሄ መሣሪያ/አካውንት ቀደም ሲል ጥቅም ላይ ውሏል።</strong><br>ስህተት ይመስልዎታል ብለው ካመኑ admin ያነጋግሩ — በማረጋገጥ ይታያል።"
    },
    network: {
      t:"Error", s:"Please try again.",
      b:"⚠️ <strong>ስህተት ተፈጥሯል።</strong><br>እባክዎ ትንሽ ቆይተው Retry ይጫኑ።"
    },
    server_error: {
      t:"Error", s:"Please try again.",
      b:"⚠️ <strong>ስህተት ተፈጥሯል።</strong><br>እባክዎ ትንሽ ቆይተው Retry ይጫኑ።"
    },
  };
  const m = msgs[category] || msgs.device_retry;
  document.getElementById("ttl").textContent = m.t;
  document.getElementById("sub").textContent = m.s;
  // Technical detail (Railway/CORS/config hints) stays in the console log
  // for admins — normal users only ever see the friendly message above.
  if (detail) console.warn("[verify][detail]", detail);
  $pill.innerHTML = m.b + (DEBUG && detail ? `<br><span style="opacity:.55;font-size:.72em">debug: ${detail}</span>` : "");
  tg?.HapticFeedback?.notificationOccurred("error");

  if (category === "not_telegram") {
    // Retrying in the same non-Telegram browser can't work — send them
    // back to the bot instead of offering a pointless retry.
    const openBtn = document.getElementById("openInTgBtn");
    openBtn.href = `https://t.me/${BOT_USERNAME}`;
    openBtn.classList.add("show");
  } else if (allowRetry) {
    $retryBtn.classList.add("show");
  }
}
function closeApp(ms){ setTimeout(() => tg?.close(), ms); }
function goToApp(ms){
  setTimeout(() => {
    location.href = "https://hf-v5.vercel.app";
  }, ms);
}

/* ── Post helper ──────────────────────────────── */
async function fetchPost(url, body, ms=12000){
  const ctrl  = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, {
      method:  "POST",
      headers: {"Content-Type": "application/json"},
      body:    JSON.stringify(body),
      signal:  ctrl.signal,
    });
    clearTimeout(timer);
    return r;
  } catch(e) {
    clearTimeout(timer);
    throw e;
  }
}

/* ── SHA-256 helper ───────────────────────────── */
async function sha256(text){
  try {
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf))
      .map(b => b.toString(16).padStart(2, "0")).join("");
  } catch {
    return "sha_err_" + Date.now();
  }
}

/* ── STEP 1 — Session validation ─────────────────── */
async function validateSession(){
  activate(1);
  setBar(10);
  await new Promise(r => setTimeout(r, 300));

  const user = tg?.initDataUnsafe?.user;
  if (!initData || !user?.id) {
    throw new Error("no_tg_session");
  }
  ok(1, "Telegram Session OK");
  setBar(30);
}

/* ── STEP 2 — Hardware fingerprints ──────────────── */
async function getFingerprint(){
  activate(2);
  setBar(40);

  let canvasRaw = "";
  try {
    const c   = document.createElement("canvas");
    c.width   = 240; c.height = 60;
    const ctx = c.getContext("2d");
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle    = "#f0f";
    ctx.fillRect(0, 0, 240, 60);
    ctx.fillStyle = "rgba(102,204,0,.7)";
    ctx.font      = "15px 'Arial'";
    ctx.fillText("AnonEarn🔐verify", 4, 20);
    canvasRaw = c.toDataURL();
  } catch {}
  const canvasHash = canvasRaw ? await sha256(canvasRaw) : "canvas_err";

  let webglRaw = "";
  try {
    const cv = document.createElement("canvas");
    const gl = cv.getContext("webgl") || cv.getContext("experimental-webgl");
    if (gl) {
      const ext      = gl.getExtension("WEBGL_debug_renderer_info");
      const vendor   = gl.getParameter(ext?.UNMASKED_VENDOR_WEBGL   || 37445) || "";
      const renderer = gl.getParameter(ext?.UNMASKED_RENDERER_WEBGL || 37446) || "";
      webglRaw = vendor + "|||" + renderer;
    }
  } catch {}
  const webglHash = webglRaw ? await sha256(webglRaw) : "webgl_err";

  const screenSig = `${screen.width}x${screen.height}x${screen.colorDepth}@${Math.round(devicePixelRatio || 1) * 100}`;

  const tz   = Intl.DateTimeFormat().resolvedOptions().timeZone || "unknown";
  const lang = navigator.language || "en";

  let tgSig = "";
  if (tg) {
    const u = tg.initDataUnsafe?.user || {};
    tgSig = [
      TG_PLATFORM,
      TG_VERSION,
      tg.colorScheme    || "",
      u.language_code   || "",
      u.is_premium ? "1" : "0",
    ].join("|");
  }

  const combined = [
    canvasRaw.slice(-80),
    webglRaw,
    screenSig,
    `dpr:${devicePixelRatio || 1}`,
    `tz:${tz}`,
    `cpu:${navigator.hardwareConcurrency || 0}`,
    `plat:${navigator.platform || ""}`,
    `lang:${lang}`,
    `ua:${navigator.userAgent}`,
    tgSig,
  ].join("|||");
  const fingerprint = await sha256(combined);

  ok(2, "Hardware Signature Verified");
  setBar(65);
  return { fingerprint, canvasHash, webglHash, screenSig };
}

/* ── STEP 3 — Submit ──────────────────────────── */
async function submit(fpData){
  activate(3);
  document.getElementById("i3").textContent = "Authenticating…";
  setBar(80);

  const r = await fetchPost(`${BACKEND}/api/verify`, {
    uid:          UID,
    refId:        REF_ID,
    msgId:        MSG_ID,
    initData:     initData,
    ua:           navigator.userAgent,
    fingerprint:  fpData.fingerprint,
    canvasHash:   fpData.canvasHash,
    webglHash:    fpData.webglHash,
    screenSig:    fpData.screenSig,
    tgPlatform:   TG_PLATFORM,
    tgVersion:    TG_VERSION,
    tgAppVersion: TG_APP_VERSION,
  });

  if (r.status === 429) {
    const j = await r.json().catch(() => ({}));
    throw Object.assign(new Error("rate_limited"), { isRate: true, detail: j.detail });
  }
  if (!r.ok) throw new Error(`Server ${r.status}`);
  return await r.json();
}

/* ── Main ─────────────────────────────────────── */
(async () => {
  try {
    await validateSession();
    const fpData = await getFingerprint();
    const result = await submit(fpData);
    setBar(100);

    if (result.status === "verified" || result.status === "already_verified") {
      ok(3, "Passed ✓");
      showOK();
      goToApp(1200);
    } else if (result.status === "blocked") {
      err(3, "Rejected ✕");
      /*
       * Soft blocks: user can fix something (VPN, wait out cooldown,
       * retry fingerprinting) and try again right away.
       * Hard blocks: server already evaluated strong combined fraud
       * signals — still don't slam the door instantly, give the user
       * the message + a manual retry button instead of a scary
       * "don't bother" wall, but auto-close a bit sooner.
       */
      const softBlock = ["vpn", "no_fingerprint", "ip_cooldown"].includes(result.reason);
      showErr(result.reason || "unknown", true);
      if (!softBlock) {
        closeApp(8000);
      }
      // Soft blocks: never auto-close — let the user read, fix, and retry.
    } else {
      throw new Error("Unexpected: " + JSON.stringify(result));
    }
  } catch(e) {
    err(3, "Failed ✕");
    console.error("[verify]", e);

    let category = "unknown";
    if (e.isRate) {
      category = "ip_cooldown";           // server 429 — too many attempts,
                                           // show the "please wait" cooldown
                                           // message, not a generic retry
    } else if (e.message === "no_tg_session") {
      category = "no_tg_session";         // opened outside Telegram — send
                                           // the user back to the bot, not
                                           // a generic retry prompt
    } else if (e.name === "AbortError") {
      category = "network";               // request timed out
    } else if (e instanceof TypeError) {
      category = "network";               // fetch() itself failed — wrong
                                           // BACKEND_URL, CORS blocked, or
                                           // Railway backend is down/asleep
    } else if (typeof e.message === "string" && e.message.startsWith("Server ")) {
      category = "server_error";          // backend responded but with an
                                           // HTTP error status (404/500/…)
    }
    showErr(category, true, e.detail || e.message || String(e));
    // Don't auto-close on unexpected client errors — let user retry manually.
  }
})();
</script>
