<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hf Earn — Mini App</title>
<!-- Telegram WebApp SDK: the plain script route (simpler + more reliable
     than a wrapper package — same approach as the legacy frontend). -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  /* ===== CONFIG — the only thing to edit when deploying =====
     API_BASE: "" = same origin. On Vercel set it to the Railway backend
     URL, e.g. "https://hf-v5.up.railway.app". Mirrors frontend/config.js
     of the legacy app (BACKEND_URL there). */
  window.APP_CONFIG = { API_BASE: "https://hf-v5-production.up.railway.app" };
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
